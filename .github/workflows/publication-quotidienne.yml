name: CME - Publication quotidienne

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forcer la publication meme si ce n est pas un jour prevu'
        required: false
        default: 'false'

jobs:
  publier:
    runs-on: ubuntu-latest
    # Porte a 120 min le 27/10/2026 (quota quotidien passe de 14 a 24
    # articles/jour, ajout du Solaire recurrent -- voir QUOTAS_SOUS_SILO
    # dans pipeline.py). Le run du 27/10 a 14 articles a pris 37m48s
    # (~2m42/article) ; extrapole a 24 articles ca donnerait ~65 min, deja
    # au-dessus de l'ancienne limite de 60 min -- marge ajoutee pour eviter
    # un timeout qui couperait le run en plein milieu de publication.
    timeout-minutes: 120
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install -r pipeline/requirements.txt

      - name: Configurer les identifiants GCP
        env:
          GCP_KEY_JSON: ${{ secrets.GCP_SA_KEY_CME }}
        run: |
          echo "$GCP_KEY_JSON" > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Lancer la publication
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python run_pipeline_action.py --force
          else
            python run_pipeline_action.py
          fi
