name: CME - Sync Clarity

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install -r pipeline/requirements.txt

      - name: Configurer les identifiants GCP
        env:
          GCP_KEY_JSON: ${{ secrets.GCP_SA_KEY_CME }}
        run: |
          echo "$GCP_KEY_JSON" > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Lancer la synchronisation
        working-directory: pipeline
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: python sync_clarity_action.py
