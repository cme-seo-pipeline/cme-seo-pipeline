name: CME - Sync indicateurs reglementaires

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Rend deterministe le rendu des schemas SVG (pipeline.py, CELLULE
      # 11B) : sans cette police, cairosvg retombe sur DejaVu Sans (plus
      # large qu'Arial) et les textes tronques par nombre de caracteres
      # debordent de leur boite/cercle -- corrige le 11/11/2026.
      - name: Installer la police Liberation Sans (schemas SVG)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation && sudo fc-cache -f

      - name: Installer les dependances
        run: pip install -r pipeline/requirements.txt

      - name: Configurer les identifiants GCP
        env:
          GCP_KEY_JSON: ${{ secrets.GCP_SA_KEY_CME }}
        run: |
          echo "$GCP_KEY_JSON" > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Lancer la synchronisation
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python sync_indicateurs_action.py
